name: deploy

# Pull requests run the tests. Push to main runs them again, deploys, and then
# proves the deployed worker can actually render. Docs-only changes are ignored
# (paths filter), and `deploy` needs `test`, so a red build never ships.
#
# Added because merging a PR here previously changed nothing in production: the
# repo had no deploy path, so every release depended on someone remembering to
# run `wrangler deploy` by hand. Two merged fixes sat undeployed until that was
# noticed.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  # Pull requests run `test` and stop there. Without this, the first signal on a
  # change arrived only after it merged and was already deploying — which is how
  # the 2026-08-02 missing-import bug reached production unopposed.
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Split into two jobs so the check NAME tells the truth. A single gated job would
# report a green "deploy" on a pull request that deployed nothing, and a status
# that reads as more than it did is the same failure as a suite reporting 16
# tests because two files failed to load.
jobs:
  # Job name is the required-check context; the estate requires `ci` everywhere.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Test
        run: node --test

  deploy:
    needs: ci
    # Nothing to deploy from a PR, and a fork PR cannot read the secrets anyway.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Required here too, and not only for the tests: wrangler bundles the
      # worker, so `markdown-it` must be resolvable or the build has no parser.
      - name: Install
        run: npm ci

      # Fail loudly rather than skipping. A guarded deploy that silently no-ops
      # reports green while shipping nothing — the failure mode already seen on
      # wizard-web, where every app was skipped for a missing token while the
      # workflow reported success.
      - name: Require deploy credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — refusing to report success without deploying."
            exit 1
          fi

      # wrangler.toml is gitignored by design (it carries the account id, the KV
      # namespace id and the live route -- identifiers, not credentials, but the
      # account layout of a public worker is not worth publishing). CI rebuilds
      # it from the tracked template using repo VARIABLES, so the deploy has a
      # `main` entry point and the PRODUCTS binding.
      - name: Materialise wrangler.toml from the template
        run: |
          test -n "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" || { echo "::error::vars.CLOUDFLARE_ACCOUNT_ID unset"; exit 1; }
          test -n "${{ vars.MAILER_KV_PRODUCTS_ID }}" || { echo "::error::vars.MAILER_KV_PRODUCTS_ID unset"; exit 1; }
          sed -e 's|YOUR_CLOUDFLARE_ACCOUNT_ID|${{ vars.CLOUDFLARE_ACCOUNT_ID }}|' \
              -e 's|YOUR_KV_NAMESPACE_ID|${{ vars.MAILER_KV_PRODUCTS_ID }}|' \
              -e 's|mailer.example.com|mailer.thompsonblack.us|' \
              -e 's|https://notify.example.com|https://notify.thompsonblack.us|' \
              wrangler.toml.example > wrangler.toml
          grep -q 'YOUR_' wrangler.toml && { echo "::error::template placeholders remain"; exit 1; } || true
          echo "wrangler.toml materialised:"; grep -vE '^\s*#' wrangler.toml | grep -vE '^\s*$'

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          # Scoped token: Workers Scripts + Routes write, Account Settings read.
          # account_id lives in wrangler.toml. Secrets/vars are NOT touched.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'

      # A deploy is not proven by a 200 from /health. On 2026-08-02 this worker
      # deployed cleanly, answered /health, and could not render a single message
      # — two symbols were used but never imported, so `handleSend` threw 1101 on
      # every request. 68 green tests could not see it: the fault was in how the
      # module graph resolved in workerd, not in any behaviour Node executes.
      #
      # /selftest runs the real render path in the deployed runtime and asserts
      # the §9 guards still throw. It sends no mail and needs no token, so this
      # step adds no secret to CI and cannot email anyone on a merge.
      - name: Smoke test the deployed worker
        run: |
          URL=https://mailer.thompsonblack.us/selftest
          # Retry until the ASSERTIONS pass, not merely until something answers 200.
          # A deploy propagates for a few seconds, so the first 200 can still be the
          # PREVIOUS version. That is exactly how this step failed on the deploy that
          # added muster's binding probes: the request landed 0.2s after "Deployed",
          # got the old body with HTTP 200, left the loop because the loop only tested
          # liveness, and then failed an assertion about content that version never
          # claimed to serve. The retry condition and the pass condition must be the
          # same condition.
          healthy() {
              grep -q '"ok":[[:space:]]*true' selftest.json
          }
          for attempt in 1 2 3 4 5 6 7 8; do
            # curl's own %{http_code} is 000 when the connection fails; `|| true`
            # keeps that from tripping `set -e` without appending a second 000.
            code=$(curl -sS -o selftest.json -w '%{http_code}' --max-time 20 "$URL" || true)
            code=${code:-000}
            if [ "$code" = "200" ] && healthy; then
              echo "--- /selftest -> 200 ---"
              cat selftest.json
              echo
              echo "deployed worker renders, and every guard still throws."
              exit 0
            fi
            # A self-reported failure is a verdict, not a propagation delay.
            if grep -qE '"ok":[[:space:]]*false' selftest.json 2>/dev/null; then
              echo "--- /selftest -> $code (worker reports failure) ---"
              cat selftest.json
              echo
              echo "::error::the deployed worker failed its self-test — it answered and judged itself failed."
              exit 1
            fi
            echo "attempt $attempt: HTTP $code — $(head -c 160 selftest.json 2>/dev/null)"
            sleep 5
          done
          echo "--- /selftest -> $code after 8 attempts ---"
          cat selftest.json 2>/dev/null || echo "(no body)"
          echo
          echo "::error::the deployed worker failed its self-test (HTTP $code). The deploy reported success but the running code is not serving correctly."
          exit 1
