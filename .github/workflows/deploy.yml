name: deploy

# Push to main deploys the worker. Docs-only changes are ignored (paths filter),
# and the tests run first so a red build never reaches production.
#
# Added because merging a PR here previously changed nothing in production: the
# repo had no deploy path, so every release depended on someone remembering to
# run `wrangler deploy` by hand. Two merged fixes sat undeployed until that was
# noticed.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: node --test

      # Fail loudly rather than skipping. A guarded deploy that silently no-ops
      # reports green while shipping nothing — the failure mode already seen on
      # wizard-web, where every app was skipped for a missing token while the
      # workflow reported success.
      - name: Require deploy credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — refusing to report success without deploying."
            exit 1
          fi

      # wrangler.toml is gitignored by design (it carries the account id, the KV
      # namespace id and the live route -- identifiers, not credentials, but the
      # account layout of a public worker is not worth publishing). CI rebuilds
      # it from the tracked template using repo VARIABLES, so the deploy has a
      # `main` entry point and the PRODUCTS binding.
      - name: Materialise wrangler.toml from the template
        run: |
          test -n "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" || { echo "::error::vars.CLOUDFLARE_ACCOUNT_ID unset"; exit 1; }
          test -n "${{ vars.MAILER_KV_PRODUCTS_ID }}" || { echo "::error::vars.MAILER_KV_PRODUCTS_ID unset"; exit 1; }
          sed -e 's|YOUR_CLOUDFLARE_ACCOUNT_ID|${{ vars.CLOUDFLARE_ACCOUNT_ID }}|' \
              -e 's|YOUR_KV_NAMESPACE_ID|${{ vars.MAILER_KV_PRODUCTS_ID }}|' \
              -e 's|mailer.example.com|mailer.thompsonblack.us|' \
              -e 's|https://notify.example.com|https://notify.thompsonblack.us|' \
              wrangler.toml.example > wrangler.toml
          grep -q 'YOUR_' wrangler.toml && { echo "::error::template placeholders remain"; exit 1; } || true
          echo "wrangler.toml materialised:"; grep -vE '^\s*#' wrangler.toml | grep -vE '^\s*$'

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          # Scoped token: Workers Scripts + Routes write, Account Settings read.
          # account_id lives in wrangler.toml. Secrets/vars are NOT touched.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
